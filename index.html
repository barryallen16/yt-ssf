<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yt-ssf Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <script type="module">
    import { Meilisearch } from "https://www.unpkg.com/meilisearch";

    const client = new Meilisearch({
      host: "https://adhi.isroot.in", 
      apiKey: "barryallen@16",
    });

    const indexes = {
      videos: client.index("yt-ssf"),
      playlists: client.index("yt-playlists"),
      courses: client.index("yt-courses"),
    };
    let activeTab = "videos";
    let activeSort = [];

    // Main search function (called on input change)
    async function searchIndex(query, resultsContainer) {
      if (!query) {
        resultsContainer.innerHTML = "";
        return;
      }

      try {
        const response = await indexes[activeTab].search(query, {
          limit: 100,
          ...(activeSort.length ? { sort: activeSort } : {}),
        });

        // Render the results
        renderResults(response.hits, resultsContainer);
      } catch (error) {
        console.error("Meilisearch Error:", error);
        resultsContainer.innerHTML = `<p class="text-red-500 text-center col-span-full">Error connecting to search engine.</p>`;
      }
    }

    // Function to render the hits into the grid
    function renderResults(hits, resultsContainer) {
      if (hits.length === 0) {
        resultsContainer.innerHTML = `<p class="text-neutral-500 text-center col-span-full py-10">No results found.</p>`;
        return;
      }

      // Generate HTML for each hit
      resultsContainer.innerHTML = hits
        .map((hit) => (activeTab === "videos" ? videoCard(hit) : playlistCard(hit)))
        .join("");
    }

    function videoCard(hit) {
      return `
          <a href="https://youtube.com/watch?v=${hit.id}" target="_blank" class="group h-full">
            <div class="bg-[#1a1a1a] border border-neutral-800 rounded-xl p-4 hover:border-neutral-600 hover:scale-[1.02] transition duration-200 h-full flex flex-col justify-between">
              <div>
                <!-- FIXED: Changed to aspect-video for a clean, non-stretched layout -->
                <img src="${hit.thumbnail_url}" alt="thumbnail" class="w-full aspect-video object-cover rounded-lg mb-3">
                <h2 class="text-base font-semibold text-white mb-1.5 line-clamp-2 group-hover:text-blue-400 transition duration-150">
                  ${hit.title}
                </h2>
                <p class="text-neutral-400 text-xs line-clamp-2 mb-4">
                  ${hit.description ? hit.description.substring(0, 80) + "..." : "No description available."}
                </p>
              </div>
              <div class="text-[11px] text-neutral-500 pt-2 border-t border-neutral-800/60 flex items-center gap-1.5 mt-auto">
                <i class="fa-solid fa-circle-user text-neutral-600"></i>
                <span class="truncate">${hit.channel_name}</span>
              </div>
            </div>
          </a>
      `;
    }

    function playlistCard(hit) {
      return `
          <a href="${hit.url}" target="_blank" class="group h-full">
            <div class="bg-[#1a1a1a] border border-neutral-800 rounded-xl p-4 hover:border-neutral-600 hover:scale-[1.02] transition duration-200 h-full flex flex-col justify-between">
              <div>
                <div class="relative mb-3">
                  <img src="${hit.thumbnail_url}" alt="thumbnail" class="w-full aspect-video object-cover rounded-lg">
                  <div class="absolute bottom-0 inset-x-0 flex items-center justify-between px-2 py-1 bg-black/70 rounded-b-lg text-[11px] text-white">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-list"></i>${hit.video_count} videos</span>
                    <span>${hit.total_duration_text}</span>
                  </div>
                </div>
                <h2 class="text-base font-semibold text-white mb-1.5 line-clamp-2 group-hover:text-blue-400 transition duration-150">
                  ${hit.title}
                </h2>
              </div>
              <div class="text-[11px] text-neutral-500 pt-2 border-t border-neutral-800/60 flex items-center gap-1.5 mt-auto">
                <i class="fa-solid fa-circle-user text-neutral-600"></i>
                <span class="truncate">${hit.channel_name || ""}</span>
                ${hit.playlist_views != null ? `<span class="ml-auto shrink-0">${Number(hit.playlist_views).toLocaleString()} views</span>` : ""}
              </div>
            </div>
          </a>
      `;
    }

    // Initialize layout setup inside window load safely
    window.addEventListener("load", () => {
      const searchInput = document.getElementById("searchInput");
      const resultsContainer = document.getElementById("resultsContainer");
      const sortSelect = document.getElementById("sortSelect");
      const tabBtns = [...document.querySelectorAll(".tab-btn")];

      const ACTIVE = "tab-btn px-5 py-2 rounded-full text-sm border border-blue-500 bg-[#2a2a2a] text-white transition";
      const IDLE = "tab-btn px-5 py-2 rounded-full text-sm border border-neutral-800 bg-[#1a1a1a] text-neutral-400 hover:text-white transition";

      function paintTabs() {
        tabBtns.forEach((b) => (b.className = b.dataset.tab === activeTab ? ACTIVE : IDLE));
        sortSelect.classList.toggle("hidden", activeTab === "videos");
      }

      tabBtns.forEach((b) =>
        b.addEventListener("click", () => {
          activeTab = b.dataset.tab;
          activeSort = [];
          sortSelect.value = "";
          paintTabs();
          if (searchInput.value.trim()) searchIndex(searchInput.value.trim(), resultsContainer);
        }),
      );

      sortSelect.addEventListener("change", () => {
        activeSort = sortSelect.value ? [sortSelect.value] : [];
        if (searchInput.value.trim()) searchIndex(searchInput.value.trim(), resultsContainer);
      });

      paintTabs();

      searchInput.addEventListener("input", (e) => {
        searchIndex(e.target.value, resultsContainer);
      });

      // Keyboard shortcut listener (Ctrl+K / Cmd+K to focus, Esc to unfocus)
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault(); // Prevent default browser search behavior
          searchInput.focus();
          searchInput.select(); // Selects existing search text for easy typing
        } else if (e.key === "Escape") {
          if (document.activeElement === searchInput) {
            searchInput.blur();
          }
        }
      });

      const defaultQuery = ""; 
      if (defaultQuery) {
        searchInput.value = defaultQuery;
        searchIndex(defaultQuery, resultsContainer);
      }
    });
  </script>

  <body class="bg-[#070708] text-neutral-100 min-h-screen font-mono">
    <div class="container mx-auto p-4 md:p-8">
      <header class="mb-8 flex items-center justify-center gap-4">
        <img src="./static/banner.png" alt="yt-ssf banner" class="max-w-full h-auto max-h-32 object-contain" />
      </header>

      <div class="relative w-full max-w-2xl mx-auto mb-6">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="fa fa-search text-neutral-500" aria-hidden="true"></i>
        </div>
        <input
          id="searchInput"
          type="text"
          placeholder="Search for videos, topics, or OnePlus... (Ctrl+K)"
          class="w-full bg-[#1a1a1a] border border-neutral-800 text-neutral-100 rounded-full py-3.5 pl-12 pr-6 text-base focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
        />
      </div>

      <div class="flex items-center justify-center gap-2 mb-12">
        <button data-tab="videos" class="tab-btn">Videos</button>
        <button data-tab="playlists" class="tab-btn">Playlists</button>
        <button data-tab="courses" class="tab-btn">Courses</button>
        <select
          id="sortSelect"
          class="hidden bg-[#1a1a1a] border border-neutral-800 text-neutral-400 text-sm rounded-full px-4 py-2 outline-none focus:border-blue-500 transition"
        >
          <option value="">Relevance</option>
          <option value="total_duration_seconds:desc">Longest first</option>
          <option value="total_duration_seconds:asc">Shortest first</option>
          <option value="playlist_views:desc">Most viewed</option>
          <option value="playlist_views:asc">Fewest viewed</option>
        </select>
      </div>

      <!-- FIXED: Altered layout structure to 4 columns on large screens -->
      <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <p class="text-neutral-500 text-center col-span-full py-10">
          Type above to search...
        </p>
      </div>
    </div>
  </body>
</html>
